name: ProduceOrderGuide
options:
  bundleIdPrefix: com.shelfpress
  deploymentTarget:
    iOS: "17.0"
targets:
  ProduceOrderGuide:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shelfpress.produceorderguide
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Order Guide
        INFOPLIST_KEY_NSCameraUsageDescription: Scan PLU and UPC codes to find or add produce items.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
